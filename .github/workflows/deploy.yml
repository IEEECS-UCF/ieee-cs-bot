name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test -race ./...
      - name: Build the Linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ieee-bot ./cmd/ieee-bot
      - uses: actions/upload-artifact@v4
        with:
          name: ieee-bot
          path: ieee-bot
          retention-days: 7

  deploy:
    needs: build
    # A manual run from another branch only builds and tests; production runs main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A hung deploy would otherwise hold the deploy queue for hours
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ieee-bot
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's deploy.sh installs the binary sent on stdin (and puts the
          # previous one back if the new one doesn't log in)
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 ubuntu@"$HOST" deploy < ieee-bot
